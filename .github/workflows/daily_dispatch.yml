name: 🕵️‍♂️ MarketSherlock Weekly Intelligence Cockpit

on:
  schedule:
    # 01:00 UTC = 08:00 AM Bangkok Time (Runs Mon-Fri; executes on Monday 08:00 AM or next business day if holiday)
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-run even if already published this week'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  investigate_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🕵️‍♂️ Run MarketSherlock Weekly Intelligence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: 'Asia/Bangkok'
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python main.py --force
          else
            python main.py
          fi

      - name: 📤 Commit and push changes
        run: |
          git config --global user.name "MarketSherlock-Bot"
          git config --global user.email "bot@marketsherlock.internal"
          git add LATEST.md README.md archives/ web/ index.html data/history.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit (already up to date or skipped)."
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "feat(weekly): 📊 MarketSherlock Weekly Dispatch for ${TODAY} [skip ci]"
            git push origin main
          fi
